<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL Music Manager — Help</title>
    <style>
        @font-face {
            font-family: 'Lexend';
            src: url('../fonts/Lexend-Variable.ttf') format('truetype');
            font-weight: 100 900;
            font-display: swap;
        }
        :root {
            --bg: #0f172a; --panel: #111c33; --border: rgba(255, 255, 255, 0.08);
            --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font-family: 'Lexend', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            display: grid; grid-template-columns: 240px 1fr; height: 100vh;
        }
        nav { border-right: 1px solid var(--border); padding: 20px 14px; overflow-y: auto; background: var(--panel); }
        nav h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 6px 8px; }
        nav a { display: block; color: var(--text); text-decoration: none; padding: 6px 8px; border-radius: 6px; font-size: 0.88rem; }
        nav a:hover, nav a.active { background: rgba(56, 189, 248, 0.12); color: #fff; }
        .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .lang button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 0.8rem; font-weight: 600; }
        .lang button.on { background: var(--accent); color: #04121f; }
        main { overflow-y: auto; padding: 28px 40px 60px; scroll-behavior: smooth; }
        article { max-width: 860px; line-height: 1.65; font-size: 0.95rem; }
        h1 { font-size: 1.7rem; margin-top: 0; }
        h2 { font-size: 1.25rem; margin-top: 2.2em; padding-top: 0.4em; border-top: 1px solid var(--border); }
        h3 { font-size: 1.05rem; }
        a { color: var(--accent); }
        code { background: rgba(255, 255, 255, 0.07); padding: 1px 6px; border-radius: 5px; font-size: 0.88em; }
        pre { background: rgba(0, 0, 0, 0.35); padding: 12px; border-radius: 8px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.9rem; }
        th, td { border-bottom: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
        th { color: var(--muted); font-weight: 600; }
        blockquote { margin: 14px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: rgba(56, 189, 248, 0.07); border-radius: 0 8px 8px 0; }
        blockquote p { margin: 0; }
        .error { color: #f87171; }
        .about { color: var(--muted); font-size: 0.8rem; margin: 22px 6px 0; }
    </style>
</head>
<body>
    <nav>
        <div class="lang" role="group" aria-label="Language">
            <button data-lang="vi">Tiếng Việt</button>
            <button data-lang="en">English</button>
        </div>
        <h2 id="toc-title">Mục lục</h2>
        <div id="toc"></div>
        <div class="about" id="about"></div>
    </nav>
    <main id="main"><article id="content">Loading…</article></main>

    <script src="../js/markdown.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(location.search);
            const stored = localStorage.getItem('helpLang');
            let lang = params.get('lang') || stored || ((navigator.language || '').startsWith('vi') ? 'vi' : 'en');
            const content = document.getElementById('content');
            const toc = document.getElementById('toc');

            async function load() {
                document.documentElement.lang = lang;
                document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
                document.getElementById('toc-title').textContent = lang === 'vi' ? 'Mục lục' : 'Contents';
                try {
                    const res = await fetch(`guide.${lang}.md`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const { html, toc: items } = KlmmMarkdown.render(await res.text());
                    content.innerHTML = html; // html đã được escape bởi markdown.js
                    toc.innerHTML = '';
                    items.forEach(it => {
                        const a = document.createElement('a');
                        a.href = `#${it.id}`;
                        a.textContent = it.text;
                        toc.appendChild(a);
                    });
                    const target = location.hash && document.getElementById(location.hash.slice(1));
                    if (target) target.scrollIntoView();
                } catch (e) {
                    content.innerHTML = '';
                    const p = document.createElement('p');
                    p.className = 'error';
                    p.textContent = `Cannot load the guide: ${e.message}`;
                    content.appendChild(p);
                }
            }

            document.querySelectorAll('.lang button').forEach(b =>
                b.addEventListener('click', () => {
                    lang = b.dataset.lang;
                    localStorage.setItem('helpLang', lang);
                    load();
                }),
            );
            fetch('/api/about')
                .then(r => r.json())
                .then(a => {
                    document.getElementById('about').textContent = `${a.name} ${a.version} · ${a.license}`;
                })
                .catch(() => {});
            load();
        })();
    </script>
</body>
</html>
