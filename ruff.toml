# Cố định theo code hiện có: pygpod/ đã format ở 100 cột.
# Chọn rule tường minh để nâng cấp ruff không đổi bộ rule (ruff 0.17 mặc định rộng hơn nhiều).
line-length = 100
target-version = "py310"
extend-exclude = ["static"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"pygpod/__init__.py" = ["E402"] # logger định nghĩa trước import, có chủ đích
"ipod_manager.py" = ["E402"]    # sys.path.append trước import
